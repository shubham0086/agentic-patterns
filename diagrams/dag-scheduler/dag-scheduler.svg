<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" height="100%" style="background-color: #0b0f17; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Background Dot Grid Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1e293b" fill-opacity="0.6" />
    </pattern>

    <!-- CSS Animations -->
    <style>
      /* Glowing animated flow paths */
      .flow-active {
        stroke-dasharray: 8, 12;
        animation: flow-anim 2s linear infinite;
      }
      @keyframes flow-anim {
        to {
          stroke-dashoffset: -20;
        }
      }

      /* Active feedback loop animation */
      .flow-loop {
        stroke-dasharray: 4, 6;
        animation: loop-anim 1.5s linear infinite;
      }
      @keyframes loop-anim {
        to {
          stroke-dashoffset: -10;
        }
      }

      /* DB communication sync pulses */
      .db-sync {
        stroke-dasharray: 3, 5;
        animation: db-sync-anim 3s linear infinite;
      }
      @keyframes db-sync-anim {
        to {
          stroke-dashoffset: -16;
        }
      }

      /* Auditor node active reviewing pulse */
      .status-pulse-amber {
        animation: pulse-amber 1.6s infinite ease-in-out;
      }
      @keyframes pulse-amber {
        0%, 100% { fill-opacity: 0.3; r: 3.5px; fill: #f59e0b; }
        50% { fill-opacity: 1; r: 5.5px; fill: #fbbf24; }
      }
    </style>
    
    <!-- Gradients for Nodes -->
    <linearGradient id="planner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="impl-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="test-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="audit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="doc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="blackboard-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.02" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#14b8a6" />
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e" />
    </marker>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Apply Grid -->
  <rect width="900" height="580" fill="url(#dot-grid)" />

  <!-- Title -->
  <text x="30" y="40" fill="#f8fafc" font-size="18" font-weight="600" letter-spacing="-0.5px">Kahn's DAG Topological Agent Scheduler</text>
  <text x="30" y="60" fill="#64748b" font-size="12">Visualizing asynchronous multi-agent execution with dynamic feedback loops and state isolation</text>

  <!-- Connection Lines (Edges) -->
  <!-- Planner -> Implementer -->
  <path d="M 180 200 C 220 200, 220 135, 270 135" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- Planner -> Tester -->
  <path d="M 180 200 C 220 200, 220 265, 270 265" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />
  
  <!-- Implementer -> Auditor -->
  <path d="M 410 135 C 460 135, 460 200, 500 200" fill="none" stroke="#14b8a6" stroke-opacity="0.3" stroke-width="2" />
  <path d="M 410 135 C 460 135, 460 200, 500 200" fill="none" stroke="#2dd4bf" stroke-width="2" class="flow-active" marker-end="url(#arrow-active)" />
  
  <!-- Tester -> Auditor -->
  <path d="M 410 265 C 460 265, 460 200, 500 200" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />
  
  <!-- Auditor -> Implementer Loop (Feedback Edge) -->
  <path d="M 570 185 C 570 70, 340 70, 340 95" fill="none" stroke="#f43f5e" stroke-width="1.5" class="flow-loop" marker-end="url(#arrow-loop)" />
  <text x="440" y="80" fill="#f43f5e" font-size="11" text-anchor="middle" font-weight="500">Feedback Loop (Fail Review)</text>

  <!-- Auditor -> Documenter -->
  <path d="M 640 200 H 710" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Shared Blackboard State connections (dashed lines to database) -->
  <path d="M 115 235 V 360 C 115 380, 230 380, 250 390" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" class="db-sync" />
  <path d="M 340 170 V 360 C 340 380, 360 380, 370 390" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" class="db-sync" />
  <path d="M 570 235 V 360 C 570 380, 490 380, 470 390" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" class="db-sync" />

  <!-- 1. Planner Node -->
  <g transform="translate(40, 165)" filter="url(#shadow)">
    <rect width="140" height="70" rx="8" fill="#131924" fill-opacity="0.9" stroke="#0ea5e9" stroke-width="1.5" />
    <rect width="140" height="70" rx="8" fill="url(#planner-grad)" />
    <circle cx="20" cy="22" r="4" fill="#10b981" />
    <text x="32" y="26" fill="#f8fafc" font-size="13" font-weight="600">Planner Agent</text>
    <text x="20" y="46" fill="#94a3b8" font-size="11" font-family="monospace">in_degree: 0</text>
    <text x="20" y="58" fill="#10b981" font-size="10" font-weight="500">status: completed</text>
  </g>

  <!-- 2. Implementer Node -->
  <g transform="translate(270, 100)" filter="url(#shadow)">
    <rect width="140" height="70" rx="8" fill="#131924" fill-opacity="0.9" stroke="#14b8a6" stroke-width="1.5" />
    <rect width="140" height="70" rx="8" fill="url(#impl-grad)" />
    <circle cx="20" cy="22" r="4" fill="#10b981" />
    <text x="32" y="26" fill="#f8fafc" font-size="13" font-weight="600">Implementer</text>
    <text x="20" y="46" fill="#94a3b8" font-size="11" font-family="monospace">in_degree: 0 (1 req)</text>
    <text x="20" y="58" fill="#10b981" font-size="10" font-weight="500">status: completed</text>
  </g>

  <!-- 3. Tester Node -->
  <g transform="translate(270, 230)" filter="url(#shadow)">
    <rect width="140" height="70" rx="8" fill="#131924" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.2" />
    <rect width="140" height="70" rx="8" fill="url(#test-grad)" />
    <circle cx="20" cy="22" r="4" fill="#10b981" />
    <text x="32" y="26" fill="#f8fafc" font-size="13" font-weight="600">Tester Agent</text>
    <text x="20" y="46" fill="#94a3b8" font-size="11" font-family="monospace">in_degree: 0 (1 req)</text>
    <text x="20" y="58" fill="#10b981" font-size="10" font-weight="500">status: completed</text>
  </g>

  <!-- 4. Auditor Node -->
  <g transform="translate(500, 165)" filter="url(#shadow)">
    <rect width="140" height="70" rx="8" fill="#131924" fill-opacity="0.9" stroke="#f43f5e" stroke-width="1.5" />
    <rect width="140" height="70" rx="8" fill="url(#audit-grad)" />
    <circle cx="20" cy="22" r="4.5" fill="#f59e0b" class="status-pulse-amber" />
    <text x="32" y="26" fill="#f8fafc" font-size="13" font-weight="600">Auditor Agent</text>
    <text x="20" y="46" fill="#94a3b8" font-size="11" font-family="monospace">in_degree: 0 (2 req)</text>
    <text x="20" y="58" fill="#f59e0b" font-size="10" font-weight="500">status: reviewing</text>
  </g>

  <!-- 5. Documenter Node -->
  <g transform="translate(720, 165)" filter="url(#shadow)">
    <rect width="140" height="70" rx="8" fill="#131924" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
    <rect width="140" height="70" rx="8" fill="url(#doc-grad)" />
    <circle cx="20" cy="22" r="4" fill="#64748b" />
    <text x="32" y="26" fill="#f8fafc" font-size="13" font-weight="600">Documenter</text>
    <text x="20" y="46" fill="#94a3b8" font-size="11" font-family="monospace">in_degree: 1 (auditor)</text>
    <text x="20" y="58" fill="#64748b" font-size="10" font-weight="500">status: queued</text>
  </g>

  <!-- Shared Blackboard State UI Card -->
  <g transform="translate(230, 390)" filter="url(#shadow)">
    <rect width="440" height="150" rx="10" fill="#0f172a" fill-opacity="0.95" stroke="#f59e0b" stroke-width="1.5" />
    <rect width="440" height="150" rx="10" fill="url(#blackboard-grad)" />
    
    <!-- Title and Icon -->
    <path d="M 22 25 L 30 20 L 38 25 L 38 35 L 30 40 L 22 35 Z" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    <path d="M 22 28.5 L 30 33.5 L 38 28.5" fill="none" stroke="#f59e0b" stroke-width="1.2" />
    <path d="M 30 33.5 V 40" fill="none" stroke="#f59e0b" stroke-width="1.2" />
    <text x="50" y="32" fill="#f8fafc" font-size="14" font-weight="600">Shared Blackboard State Contract</text>
    <text x="50" y="48" fill="#64748b" font-size="11">Append-only central database preventing context pollution</text>
    
    <!-- Key-Value Display -->
    <rect x="20" y="65" width="400" height="70" rx="6" fill="#020617" fill-opacity="0.5" stroke="#1e293b" stroke-width="1" />
    
    <text x="35" y="85" fill="#f59e0b" font-family="monospace" font-size="11">state.goal:</text>
    <text x="125" y="85" fill="#38bdf8" font-family="monospace" font-size="11">"Implement JWT-based API Authentication..."</text>
    
    <text x="35" y="105" fill="#f59e0b" font-family="monospace" font-size="11">state.notes:</text>
    <text x="125" y="105" fill="#e2e8f0" font-family="monospace" font-size="11">[ "planner: plan structured", "implementer: code ready" ]</text>

    <text x="35" y="125" fill="#f59e0b" font-family="monospace" font-size="11">state.status:</text>
    <text x="125" y="125" fill="#a7f3d0" font-family="monospace" font-size="11">{ planner: "done", implementer: "done", auditor: "running" }</text>
  </g>
</svg>
