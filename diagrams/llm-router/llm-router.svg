<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" height="100%" style="background-color: #0b0f17; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Background Dot Grid Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1e293b" fill-opacity="0.6" />
    </pattern>

    <!-- CSS Animations -->
    <style>
      /* Glowing animated flow paths */
      .flow-active {
        stroke-dasharray: 8, 12;
        animation: flow-anim 2s linear infinite;
      }
      @keyframes flow-anim {
        to {
          stroke-dashoffset: -20;
        }
      }

      /* Failover alert flashing */
      .failover-path {
        stroke-dasharray: 4, 4;
        animation: failover-anim 1.5s linear infinite;
      }
      @keyframes failover-anim {
        to {
          stroke-dashoffset: -8;
        }
      }

      /* Active running state pulse */
      .status-pulse-green {
        animation: pulse-green 1.8s infinite ease-in-out;
      }
      @keyframes pulse-green {
        0%, 100% { fill-opacity: 0.3; r: 3.5px; fill: #10b981; }
        50% { fill-opacity: 1; r: 5.5px; fill: #00ff88; }
      }

      /* Circuit breaker tripped alarm pulse */
      .status-pulse-red {
        animation: pulse-red 1s infinite ease-in-out;
      }
      @keyframes pulse-red {
        0%, 100% { fill-opacity: 0.4; r: 4px; fill: #ef4444; }
        50% { fill-opacity: 1; r: 6px; fill: #ff3b30; }
      }

      /* Rate limited warning warning pulse */
      .status-pulse-amber {
        animation: pulse-amber 1.6s infinite ease-in-out;
      }
      @keyframes pulse-amber {
        0%, 100% { fill-opacity: 0.4; r: 4px; fill: #eab308; }
        50% { fill-opacity: 1; r: 5.5px; fill: #fbbf24; }
      }

      /* Glowing output card border */
      .glow-border {
        animation: glow-border-anim 2s infinite ease-in-out;
      }
      @keyframes glow-border-anim {
        0%, 100% { stroke-width: 1.5px; opacity: 0.7; }
        50% { stroke-width: 2.5px; opacity: 1; stroke: #00ff88; }
      }

      /* Terminal Cursor Blinking */
      .cursor-blink {
        animation: cursor-blink-anim 1s step-end infinite;
      }
      @keyframes cursor-blink-anim {
        50% { opacity: 0; }
      }
    </style>
    
    <!-- Gradients for Nodes -->
    <linearGradient id="input-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="parser-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="breaker-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="success-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.02" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Apply Grid -->
  <rect width="900" height="580" fill="url(#dot-grid)" />

  <!-- Title -->
  <text x="30" y="40" fill="#f8fafc" font-size="18" font-weight="600" letter-spacing="-0.5px">Multi-Provider LLM Router with Circuit Breaker</text>
  <text x="30" y="60" fill="#64748b" font-size="12">Dynamic routing, provider exhaustion states, per-role timeouts, and failover cascades to local model endpoints</text>

  <!-- 1. Input Block (Agent Request) -->
  <g transform="translate(30, 200)" filter="url(#shadow)">
    <rect width="180" height="110" rx="8" fill="#131924" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5" />
    <rect width="180" height="110" rx="8" fill="url(#input-grad)" />
    <text x="15" y="25" fill="#f8fafc" font-size="13" font-weight="600">Agent Request</text>
    <rect x="15" y="40" width="150" height="55" rx="4" fill="#020617" fill-opacity="0.5" stroke="#1e293b" stroke-width="1" />
    <text x="25" y="58" fill="#e2e8f0" font-size="11" font-family="monospace">role: "Coder"</text>
    <text x="25" y="73" fill="#e2e8f0" font-size="11" font-family="monospace">tier: "capable"</text>
    <text x="25" y="88" fill="#e2e8f0" font-size="11" font-family="monospace">timeout: 300s</text>
  </g>

  <!-- Arrow Input -> Parser -->
  <path d="M 210 255 H 260" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 2. Route Parser & Evaluator -->
  <g transform="translate(270, 200)" filter="url(#shadow)">
    <rect width="160" height="110" rx="8" fill="#131924" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.5" />
    <rect width="160" height="110" rx="8" fill="url(#parser-grad)" />
    <text x="15" y="25" fill="#f8fafc" font-size="13" font-weight="600">Router Parser</text>
    <text x="15" y="45" fill="#e2e8f0" font-size="11">Tier Lookup: capable</text>
    <text x="15" y="65" fill="#94a3b8" font-size="11">1. Bedrock (AWS)</text>
    <text x="15" y="80" fill="#94a3b8" font-size="11">2. NIM (NVIDIA)</text>
    <text x="15" y="95" fill="#64748b" font-size="11">3. Ollama (Local)</text>
  </g>

  <!-- Arrow Parser -> Providers (Split) -->
  <path d="M 430 255 H 480" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 3. Provider Stack / Routing Chain -->
  <!-- Provider 1: OpenAI (Tripped / Excluded) -->
  <g transform="translate(490, 110)" filter="url(#shadow)">
    <rect width="180" height="65" rx="6" fill="#131924" fill-opacity="0.9" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="20" cy="20" r="5.5" fill="#ef4444" class="status-pulse-red" />
    <text x="35" y="24" fill="#f8fafc" font-size="12" font-weight="600">OpenAI API</text>
    <text x="15" y="42" fill="#ef4444" font-size="10" font-weight="600">CIRCUIT BREAKER: TRIPPED</text>
    <text x="15" y="54" fill="#94a3b8" font-size="10" font-family="monospace">Status: 503 Outage</text>
  </g>

  <!-- Provider 2: AWS Bedrock (Standby / Target) -->
  <g transform="translate(490, 195)" filter="url(#shadow)">
    <rect width="180" height="65" rx="6" fill="#131924" fill-opacity="0.9" stroke="#eab308" stroke-width="1.2" />
    <circle cx="20" cy="20" r="5" fill="#eab308" class="status-pulse-amber" />
    <text x="35" y="24" fill="#f8fafc" font-size="12" font-weight="600">AWS Bedrock API</text>
    <text x="15" y="42" fill="#e2e8f0" font-size="10">Active Model: qwen3-coder</text>
    <text x="15" y="54" fill="#eab308" font-size="10" font-family="monospace">Status: 429 Rate Limit (1/2)</text>
  </g>

  <!-- Provider 3: Local Ollama (Fallback Active) -->
  <g transform="translate(490, 280)" filter="url(#shadow)">
    <rect width="180" height="65" rx="6" fill="#131924" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5" />
    <circle cx="20" cy="20" r="5.5" fill="#10b981" class="status-pulse-green" />
    <text x="35" y="24" fill="#f8fafc" font-size="12" font-weight="600">Local Ollama</text>
    <text x="15" y="42" fill="#e2e8f0" font-size="10">Model: qwen2.5-coder:7b</text>
    <text x="15" y="54" fill="#10b981" font-size="10" font-weight="500">Status: Running (Fallback OK)</text>
  </g>

  <!-- Flow Paths inside Provider Stack -->
  <!-- From Parser output, point to OpenAI -->
  <path d="M 460 255 C 475 255, 475 142, 490 142" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" />
  <!-- Reroute from OpenAI down to Bedrock -->
  <path d="M 670 142 C 690 142, 690 180, 670 210" fill="none" stroke="#ef4444" stroke-width="1.2" class="failover-path" marker-end="url(#arrow-red)" />
  <text x="720" y="175" fill="#ef4444" font-size="10" text-anchor="middle">Failover (503)</text>

  <!-- Reroute from Bedrock down to Ollama -->
  <path d="M 670 227 C 690 227, 690 265, 670 295" fill="none" stroke="#eab308" stroke-width="1.2" class="failover-path" marker-end="url(#arrow)" />
  <text x="720" y="260" fill="#eab308" font-size="10" text-anchor="middle">Failover (429)</text>

  <!-- Ollama output -> Success -->
  <path d="M 670 312 H 710" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
  <path d="M 670 312 H 710" fill="none" stroke="#00ff88" stroke-width="2" class="flow-active" marker-end="url(#arrow-green)" />

  <!-- 4. Final Output Block -->
  <g transform="translate(720, 275)" filter="url(#shadow)">
    <rect width="150" height="75" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" class="glow-border" />
    <rect width="150" height="75" rx="6" fill="url(#success-grad)" />
    <text x="15" y="25" fill="#f8fafc" font-size="12" font-weight="600">Model Executed</text>
    <text x="15" y="45" fill="#10b981" font-size="11" font-weight="600">SUCCESS (200 OK)</text>
    <text x="15" y="60" fill="#94a3b8" font-size="10" font-family="monospace">Latency: 1.84s</text>
  </g>

  <!-- Session Circuit Breaker Dashboard (Bottom) -->
  <g transform="translate(30, 390)" filter="url(#shadow)">
    <rect width="840" height="150" rx="10" fill="#0f172a" fill-opacity="0.95" stroke="#f43f5e" stroke-width="1.5" />
    <rect width="840" height="150" rx="10" fill="url(#breaker-grad)" />
    
    <!-- Header -->
    <path d="M 22 23 H 38 V 37 H 22 Z" fill="none" stroke="#f43f5e" stroke-width="1.5" />
    <path d="M 26 27 L 34 33 M 34 27 L 26 33" fill="none" stroke="#f43f5e" stroke-width="1.5" />
    <text x="50" y="32" fill="#f8fafc" font-size="14" font-weight="600">Session Circuit Breaker Console Log</text>
    <text x="50" y="48" fill="#64748b" font-size="11">Real-time failover diagnostic logs and state tracking</text>

    <!-- Console Text Area -->
    <rect x="20" y="65" width="800" height="70" rx="6" fill="#020617" fill-opacity="0.5" stroke="#1e293b" stroke-width="1" />
    
    <text x="35" y="85" fill="#64748b" font-family="monospace" font-size="11">[15:22:01]</text>
    <text x="110" y="85" fill="#ef4444" font-family="monospace" font-size="11">[error]</text>
    <text x="170" y="85" fill="#e2e8f0" font-family="monospace" font-size="11">OpenAI API endpoint returned 503 Service Unavailable (timeout exceeded)</text>
    
    <text x="35" y="105" fill="#64748b" font-family="monospace" font-size="11">[15:22:02]</text>
    <text x="110" y="105" fill="#f59e0b" font-family="monospace" font-size="11">[circuit]</text>
    <text x="170" y="105" fill="#e2e8f0" font-family="monospace" font-size="11">OpenAI provider marked EXHAUSTED for current session. Initiating failover fallback...</text>

    <text x="35" y="125" fill="#64748b" font-family="monospace" font-size="11">[15:22:02]</text>
    <text x="110" y="125" fill="#38bdf8" font-family="monospace" font-size="11">[routing]</text>
    <text x="170" y="125" fill="#e2e8f0" font-family="monospace" font-size="11">Routing task "Coder" to Bedrock (AWS Bedrock API -> qwen3-coder)<tspan fill="#ff3b30" class="cursor-blink">|</tspan></text>
  </g>
</svg>
